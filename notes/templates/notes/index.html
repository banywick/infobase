<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'notes/css/style_notes.css' %}">
    <link rel="stylesheet" href="{% static 'notes/css/notes_popup.css' %}">
    <title>Заметки</title>
</head>
<body>
    <div class="notes-container">
        <!-- Кнопка возврата на главную -->
        <a href="{% url 'home_finder' %}" class="back-to-main-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Вернуться на главную</span>
        </a>

        <!-- Заголовок и кнопка добавления -->
        <div class="notes-header">
            <div class="notes-header-left">
                <h1 class="notes-title">Мои заметки</h1>
                <p class="notes-subtitle">Всего заметок: <span id="notes-count">0</span></p>
            </div>
            <button id="add-note-btn" class="btn-add-note">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Добавить заметку
            </button>
        </div>

        <!-- Список заметок -->
        <div class="notes-list-container">
            <div id="notes-list" class="notes-list">
                <!-- Заметки будут загружаться здесь через JavaScript -->
                <div class="notes-loading">
                    <div class="loading-spinner"></div>
                    <p>Загружаем заметки...</p>
                </div>
            </div>
        </div>

        <!-- Пустое состояние -->
        <div id="empty-notes" class="empty-notes" style="display: none;">
            <div class="empty-notes-icon">📝</div>
            <h3>Заметок пока нет</h3>
            <p>Создайте свою первую заметку!</p>
            <button id="add-first-note" class="btn-add-first-note">Добавить заметку</button>
        </div>

        <!-- Попап для добавления/редактирования -->
        <div id="note-popup" class="note-popup" style="display: none;">
            <div class="popup-overlay"></div>
            <div class="popup-content">
                <div class="popup-header">
                    <h3 id="popup-title">Добавить заметку</h3>
                    <button id="close-popup" class="btn-close-popup">&times;</button>
                </div>
                
                <form id="note-form" method="POST">
                    {% csrf_token %}
                    <input type="hidden" id="note-id" name="note_id">
                    
                    <div class="form-group">
                        <textarea id="note-text" name="text" 
                                  class="note-textarea" 
                                  placeholder="Введите текст заметки..."
                                  rows="8" 
                                  required></textarea>
                        <div class="char-counter">
                            <span id="char-count">0</span>/1000
                        </div>
                    </div>
                    
                    <div class="popup-buttons">
                        <button type="button" id="cancel-btn" class="btn-cancel">Отменить</button>
                        <button type="submit" id="save-btn" class="btn-save">
                            <span id="save-btn-text">Сохранить</span>
                            <span id="save-btn-spinner" style="display: none;">
                                <div class="small-spinner"></div>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Контейнер для уведомлений -->
        <div id="notification-container"></div>
    </div>

    <!-- Переменная для передачи данных из Django -->
    <script>
        window.currentUserId = {{ request.user.id }};
        window.csrfToken = "{{ csrf_token }}";
        window.notesApi = {
            list: "{% url 'all_notes' %}",
            add: "{% url 'add_notes' %}",
            edit: "{% url 'edit_note' 0 %}",
            delete: "{% url 'remove_note' 0 %}"
        };
    </script>

    <script src="{% static 'notes/js/notes_api.js' %}"></script>
    <script src="{% static 'notes/js/notes_ui.js' %}"></script>
</body>
</html>
