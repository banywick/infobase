server {
    listen 80;
    server_name infobase-01.okbtsp.corp;  
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name infobase-01.okbtsp.corp; 

    ssl_certificate    /etc/nginx/ssl/infobase-01.okbtsp.corp.crt;
    ssl_certificate_key /etc/nginx/ssl/infobase-01.okbtsp.corp.key;

    # Протоколы и настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Статические файлы
    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # Важно! Добавляем заголовки для контроля кэша
        add_header Pragma "public";
        # Включаем ETag (по умолчанию включен)
        etag on;
    }


    # Django application
    location / {
        proxy_pass http://web:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # ЗНАЧИТЕЛЬНО УВЕЛИЧЕННЫЕ БУФЕРЫ
        proxy_buffer_size 256k;
        proxy_buffers 16 512k;     # 16 буферов по 512k = 8MB
        proxy_busy_buffers_size 1m;  # 1MB
        proxy_temp_file_write_size 1m;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1000;
        gzip_comp_level 6;
    }

    location /health/ {
        access_log off;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    client_max_body_size 100M;
}
