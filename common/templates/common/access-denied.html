<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ запрещен</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            position: relative;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Контейнер с сообщением об ошибке */
        .error-container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Иконка запрета */
        .error-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 600;
            background: linear-gradient(45deg, #00b4db, #0083b0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 8s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .error-message-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        /* Кнопка открытия авторизации */
        .login-trigger-btn {
            background: linear-gradient(45deg, #00b4db, #0083b0);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.4);
        }

        .login-trigger-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 180, 219, 0.6);
        }

        .login-trigger-btn:active {
            transform: translateY(0);
        }

        /* Попап авторизации */
        .my-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .my-popup.show {
            display: flex;
        }

        .popup-content {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            overflow: hidden;
            animation: popupSlideIn 0.3s ease-out;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        @keyframes popupSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .popup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-header h2 {
            color: white;
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .close-btn {
            color: white;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
        }

        .close-btn:hover {
            transform: rotate(90deg);
        }

        .content-area {
            padding: 30px 25px;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            max-width: 120px;
            height: auto;
        }

        form label {
            display: block;
            color: #4a5568;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input_wrapper {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input_wrapper:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error-message {
            color: #e53e3e;
            font-size: 12px;
            margin-top: 5px;
            min-height: 20px;
        }

        .button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #00b4db, #0083b0);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 180, 219, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }

        /* Адаптивность */
        @media (max-width: 640px) {
            .error-container {
                padding: 30px 20px;
                width: 95%;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .popup-content {
                width: 95%;
            }
            
            .content-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>

    <div class="error-container">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>
        <h1>Доступ запрещен</h1>
        <p class="error-message-text">
            У вас нет доступа к данному ресурсу.<br>
            Пожалуйста, авторизуйтесь для продолжения работы.
        </p>
        <button class="login-trigger-btn" id="showAuthBtn">
            <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>
            Войти в систему
        </button>
    </div>

    <!-- Окно авторизации -->
    <div id="popup_auth" class="my-popup">
        <div class="popup-content">
            <div class="popup-header">
                <h2><i class="fas fa-lock" style="margin-right: 10px;"></i>Авторизация</h2>
                <span class="close-btn">&times;</span>
            </div>
            <div class="content-area">
                <div class="logo">
                    <img src="{% static 'finder/icon/logo_white.svg' %}" alt="Логотип">
                </div>
                <form id="loginForm" method="post">
                    {% csrf_token %}
                    
                    <label for="username">
                        <i class="fas fa-user" style="margin-right: 5px;"></i>Логин
                    </label>
                    <input class="input_wrapper" type="text" id="username" name="username" placeholder="Введите ваш логин">
                    <div class="error-message" id="usernameError"></div>
                    
                    <label for="password">
                        <i class="fas fa-key" style="margin-right: 5px;"></i>Пароль
                    </label>
                    <input class="input_wrapper" type="password" id="password" name="password" placeholder="Введите ваш пароль">
                    <div class="error-message" id="passwordError"></div>
                    
                    <button type="button" class="button" id="loginButton">
                        <i class="fas fa-arrow-right" style="margin-right: 8px;"></i>
                        Войти
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Particles.js configuration
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    },
                    "polygon": {
                        "nb_sides": 5
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": false,
                    "anim": {
                        "enable": false,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": false,
                        "speed": 40,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#ffffff",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 2,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 140,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "bubble": {
                        "distance": 400,
                        "size": 40,
                        "duration": 2,
                        "opacity": 8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    },
                    "push": {
                        "particles_nb": 4
                    },
                    "remove": {
                        "particles_nb": 2
                    }
                }
            },
            "retina_detect": true
        });

        // Получаем элементы
        const popup = document.getElementById('popup_auth');
        const showBtn = document.getElementById('showAuthBtn');
        const closeBtn = document.querySelector('.close-btn');
        
        // Функция открытия попапа
        function openPopup() {
            popup.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
        
        // Функция закрытия попапа
        function closePopup() {
            popup.classList.remove('show');
            document.body.style.overflow = '';
        }
        
        // Открытие по кнопке
        if (showBtn) {
            showBtn.addEventListener('click', openPopup);
        }
        
        // Закрытие по крестику
        if (closeBtn) {
            closeBtn.addEventListener('click', closePopup);
        }
        
        // Закрытие по клику вне попапа
        popup.addEventListener('click', function(e) {
            if (e.target === popup) {
                closePopup();
            }
        });
        
        // Закрытие по Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && popup.classList.contains('show')) {
                closePopup();
            }
        });
    </script>
    
    <script src='{% static "finder/js/auth.js" %}'></script>
</body>
</html>
