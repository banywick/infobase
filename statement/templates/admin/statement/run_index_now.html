{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block content %}
<div style="max-width: 600px; margin: 20px auto;">
  <h1>{% trans 'Запуск индексации SMB' %}</h1>
  
  <div class="warning-box" style="background: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 4px; margin: 20px 0;">
    ⚠️ <strong>Внимание!</strong><br>
    Запуск ручной индексации может занять несколько минут.
  </div>
  
  <form method="post">
    {% csrf_token %}
    <div class="submit-row">
      <input type="submit" value="▶️ Запустить индексацию" class="button default" style="background: #28a745;">
      <a href="{% url 'admin:statement_smbindexschedule_changelist' %}" class="button" style="margin-left: 10px;">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
